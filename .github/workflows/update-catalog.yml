name: Update app catalog

on:
  schedule:
    # Every Monday at 03:17 UTC. The unusual minute helps avoid peak-hour delays.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-app-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -v

      - name: Regenerate catalog
        run: python fdroid_catalog.py

      - name: Commit updated catalog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/apps.json output/apps.md output/apps.txt
          if git diff --cached --quiet; then
            echo "Catalog is already current."
            exit 0
          fi
          git commit -m "chore: update app catalog $(date -u +%F)"
          git push
